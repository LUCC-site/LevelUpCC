<html>
<head><title>Netlify Form Detection</title></head>
<body>
  
  <form name="ShareYourJourney" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="ShareYourJourney" />
    <input type="hidden" name="subject" />
    <input type="text" name="bot-field" />
    <input type="radio" name="identity" />
    <input type="text" name="full-name" />
    <input type="text" name="university-accepted" />
    <textarea name="story-details"></textarea>
  </form>

  <form name="EssayHelp" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="EssayHelpForm" />
    <input type="hidden" name="bot-field" />
    <input type="hidden" name="subject" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="text" name="target-schools" />
    <select name="draft-status"></select>
    <textarea name="message"></textarea>
  </form>

  <form name="EssayHelpRequest" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="EssayHelpRequestForm" />
    <input type="hidden" name="bot-field" />
    <input type="hidden" name="subject" />
    <input type="text" name="full-name" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <textarea name="looking-for"></textarea>
  </form>

  <form name="IntakeForm" data-netlify="true" hidden>
    <input type="hidden" name="form-name" value="IntakeForm" />
    <input type="hidden" name="subject" />
    <input type="radio" name="role" />
    <input type="number" name="gradYear" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <textarea name="message"></textarea>
  </form>

  <form name="InterviewPrep" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="InterviewPrepForm" />
    <input type="hidden" name="bot-field" />
    <input type="hidden" name="subject" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <input type="date" name="interview-date" />
    <input type="text" name="next-interview-with-who" />
    <textarea name="details"></textarea>
  </form>

  <form name="OneTime" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="OneTimeForm" />
    <input type="hidden" name="bot-field" />
    <input type="hidden" name="subject" />
    <input type="text" name="name" />
    <input type="text" name="grade" />
    <input type="email" name="email" />
    <select name="primary-goal"></select>
    <textarea name="questions"></textarea>
  </form>

</body>
</html>
